<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Navy Blue -->
  <rect x="0" y="0" width="200" height="80" fill="#1e3a5f" rx="4"/>
  
  <!-- Red stripe at bottom -->
  <rect x="0" y="50" width="200" height="30" fill="#d32f2f"/>
  
  <!-- AMECO text - White, bold -->
  <text x="100" y="42" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">AMECO</text>
  
  <!-- Registered trademark symbol -->
  <circle cx="185" cy="55" r="8" fill="white"/>
  <text x="185" y="58" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e3a5f" text-anchor="middle">®</text>
</svg>
