  <!-- AMECO text - White, bold -->
  <text x="430" y="200" font-family="Arial, sans-serif" font-size="160" font-weight="900" fill="white" text-anchor="middle" letter-spacing="5">AMECO</text>
  
  <!-- SOUTH AMERICA text - Gray -->
